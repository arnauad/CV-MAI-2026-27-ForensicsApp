[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensics-app"
version = "0.1.0"
description = "Extensible Tkinter starter for an MSc Computer Vision course"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1,<13", "numpy>=1.24", "scikit-image>=0.21", "scipy>=1.10", "opencv-python-headless>=4.8", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["forensics_app*"]
